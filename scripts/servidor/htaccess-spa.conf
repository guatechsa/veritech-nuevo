# .htaccess canónico de la página (SPA) de VERI-TECH 4.000: va en la carpeta pública de cada sitio (pruebas, demo, y el definitivo).
# Apache solo sirve la página y pasa /api al servidor (estándar §15). Aquí también van las cabeceras de seguridad de la PÁGINA (las de /api las pone el servidor).
<IfModule mod_rewrite.c>
  RewriteEngine On
  RewriteBase /

  # Todo el tráfico va por HTTPS (excepto la validación del certificado)
  RewriteCond %{HTTPS} off
  RewriteCond %{REQUEST_URI} !^/\.well-known/ [NC]
  RewriteRule ^ https://%{HTTP_HOST}%{REQUEST_URI} [L,R=301]

  # Preservar el encabezado Authorization para el JWT
  RewriteRule .* - [E=HTTP_AUTHORIZATION:%{HTTP:Authorization}]

  # La SPA: todo lo que no sea archivo, carpeta, /api ni /health vuelve a index.html
  RewriteCond %{REQUEST_URI} !^/(api|health)(/|$) [NC]
  RewriteCond %{REQUEST_URI} !^/\.well-known/ [NC]
  RewriteCond %{REQUEST_FILENAME} !-f
  RewriteCond %{REQUEST_FILENAME} !-d
  RewriteRule ^ index.html [L]
</IfModule>

Options -Indexes

<FilesMatch "^\.">
  Require all denied
</FilesMatch>

<IfModule mod_headers.c>
  Header set X-Content-Type-Options "nosniff"
  Header set X-Frame-Options "SAMEORIGIN"
  Header set Referrer-Policy "strict-origin-when-cross-origin"
  Header set Permissions-Policy "geolocation=(), microphone=(), camera=()"
  Header set Strict-Transport-Security "max-age=31536000; includeSubDomains"
  # Solo se carga lo propio y PayPal (el registro usa su botón). Los estilos en línea los usan los componentes y las ventanas de impresión.
  Header set Content-Security-Policy "default-src 'self'; base-uri 'self'; form-action 'self'; frame-ancestors 'self'; object-src 'none'; script-src 'self' https://www.paypal.com https://www.paypalobjects.com; style-src 'self' 'unsafe-inline'; font-src 'self' data:; img-src 'self' data: blob: https://*.paypal.com https://*.paypalobjects.com; connect-src 'self' https://*.paypal.com; frame-src https://*.paypal.com"
</IfModule>

<IfModule mod_deflate.c>
  AddOutputFilterByType DEFLATE text/html text/plain text/xml text/css text/javascript application/javascript application/json
</IfModule>

# GUATECH-CACHE-BLOCK-v1
<IfModule mod_headers.c>
  <FilesMatch "^index\.html$">
    Header set Cache-Control "no-cache, no-store, must-revalidate"
    Header set Pragma "no-cache"
    Header set Expires "0"
  </FilesMatch>
  <FilesMatch "-[A-Za-z0-9_-]{8}\.(js|css)$">
    Header set Cache-Control "public, max-age=31536000, immutable"
  </FilesMatch>
</IfModule>
